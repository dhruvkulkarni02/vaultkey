name: Python Package

# On every published GitHub release, the wheel and source archive are built and
# attached to the release. Uploading to (Test)PyPI is manual: run this workflow
# from the Actions tab once trusted publishing is set up on PyPI.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'testpypi'
        type: choice
        options:
        - testpypi
        - pypi

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install pypa/build
      run: python -m pip install build twine --user

    - name: Build a binary wheel and a source tarball
      run: python -m build

    - name: Check the distribution metadata
      run: python -m twine check dist/*

    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  attach-to-release:
    name: Attach to GitHub Release 📋
    if: ${{ github.event_name == 'release' }}
    needs:
    - build
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to upload release assets

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Upload to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        gh release upload
        '${{ github.event.release.tag_name }}'
        dist/*
        --clobber
        --repo '${{ github.repository }}'

  publish-to-testpypi:
    name: Publish to TestPyPI 🧪
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testpypi' }}
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/vaultkey-cli

    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI 🚀
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'pypi' }}
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/vaultkey-cli

    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
