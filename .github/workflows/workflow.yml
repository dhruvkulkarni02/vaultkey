name: Python Package

# On every published GitHub release, the wheel and source archive are built and
# attached to the release. Uploading to (Test)PyPI is manual: run this workflow
# from the Actions tab once trusted publishing is set up on PyPI.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'testpypi'
        type: choice
        options:
        - testpypi
        - pypi

# Read-only token by default; jobs that publish ask for more themselves
permissions:
  contents: read

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.x"

    - name: Install pypa/build
      run: python -m pip install build twine --user

    - name: Build a binary wheel and a source tarball
      run: python -m build

    - name: Check the distribution metadata
      run: python -m twine check dist/*

    - name: Store the distribution packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: python-package-distributions
        path: dist/

  attach-to-release:
    name: Attach to GitHub Release 📋
    if: ${{ github.event_name == 'release' }}
    needs:
    - build
    runs-on: ubuntu-latest

    permissions:
      contents: write      # needed to upload release assets
      id-token: write      # needed to sign build provenance
      attestations: write  # needed to publish build provenance

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
      with:
        name: python-package-distributions
        path: dist/

    - name: Write checksums
      run: cd dist && sha256sum * > SHA256SUMS-python.txt && cat SHA256SUMS-python.txt

    - name: Attest build provenance
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
      with:
        subject-path: dist/vaultkey_cli-*

    - name: Upload to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        gh release upload
        '${{ github.event.release.tag_name }}'
        dist/*
        --clobber
        --repo '${{ github.repository }}'

  publish-to-testpypi:
    name: Publish to TestPyPI 🧪
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testpypi' }}
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/vaultkey-cli

    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI 🚀
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'pypi' }}
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/vaultkey-cli

    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
