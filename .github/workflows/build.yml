name: Build VaultKey Executables

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]
  workflow_dispatch:

# Read-only token by default; jobs that publish ask for more themselves
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: VaultKey.exe
            asset_name: VaultKey-Windows
          - os: macos-latest
            artifact_name: VaultKey
            asset_name: VaultKey-macOS

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
    
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . pyinstaller
    
    - name: Show installed packages
      run: pip list
    
    - name: Create runner script
      shell: bash
      run: |
        cat > run_vaultkey.py << 'EOFPY'
        #!/usr/bin/env python3
        import sys
        import os
        
        # Add current directory to path
        sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
        
        # Import all dependencies to ensure they're bundled
        import argon2
        import cryptography
        import cryptography.fernet
        import click
        import rich
        import textual
        import pyperclip
        import requests
        import urllib
        import urllib.request
        import json
        import base64
        import hashlib
        import re
        import secrets
        import string
        
        # Import our package
        import vaultkey
        from vaultkey.cli import cli
        
        if __name__ == '__main__':
            cli()
        EOFPY
    
    - name: Build with PyInstaller
      shell: bash
      run: |
        pyinstaller --onefile \
          --name="${{ matrix.artifact_name }}" \
          --paths=. \
          --collect-all=cryptography \
          --collect-all=argon2 \
          --collect-all=click \
          --collect-submodules=rich \
          --collect-all=textual \
          --collect-all=requests \
          --hidden-import=requests \
          --hidden-import=urllib3 \
          --hidden-import=certifi \
          --hidden-import=charset_normalizer \
          --hidden-import=idna \
          run_vaultkey.py
    
    - name: List dist contents
      shell: bash
      run: ls -la dist/
    
    - name: Test executable
      shell: bash
      run: |
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          ./dist/${{ matrix.artifact_name }} --version
        else
          chmod +x ./dist/${{ matrix.artifact_name }}
          ./dist/${{ matrix.artifact_name }} --version
        fi
    
    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.artifact_name }}

  package:
    needs: build
    runs-on: ubuntu-latest
    
    permissions:
      contents: write      # needed to upload release assets
      id-token: write      # needed to sign build provenance
      attestations: write  # needed to publish build provenance
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
    
    - name: Create distribution packages
      run: |
        # Setup directories
        mkdir -p VaultKey/{Windows,Mac,Documentation}
        
        # Copy executables
        cp VaultKey-Windows/VaultKey.exe VaultKey/Windows/
        cp VaultKey-macOS/VaultKey VaultKey/Mac/
        chmod +x VaultKey/Mac/VaultKey
        
        # Create Windows launcher
        cat > VaultKey/Windows/VaultKey.bat << 'EOF'
        @echo off
        title VaultKey Password Manager
        cls
        echo ========================================
        echo     VaultKey Password Manager
        echo ========================================
        echo.
        cd /d "%~dp0"
        VaultKey.exe interactive
        if errorlevel 1 (
            echo.
            echo Press any key to exit...
            pause > nul
        )
        EOF
        
        # Create Mac launcher
        cat > VaultKey/Mac/VaultKey.command << 'EOF'
        #!/bin/bash
        clear
        echo "========================================"
        echo "    VaultKey Password Manager"
        echo "========================================"
        echo
        cd "$(dirname "$0")"
        ./VaultKey interactive
        EOF
        chmod +x VaultKey/Mac/VaultKey.command
        
        # Create README
        cat > VaultKey/README.txt << 'EOF'
        VaultKey Password Manager
        =========================
        
        QUICK START:
        
        WINDOWS:
        1. Open Windows folder
        2. Double-click VaultKey.bat
        
        MAC:
        1. Open Mac folder
        2. Double-click VaultKey.command
        3. If security warning appears:
           - Right-click VaultKey.command
           - Select "Open"
           - Click "Open" in dialog
        
        FIRST TIME:
        1. Create a master password (REMEMBER IT!)
        2. Press 2 to add passwords
        3. Press 4 to copy passwords quickly
        
        NEED HELP?
        - Press 0 to exit
        - Your passwords are encrypted and safe
        - Master password cannot be recovered if forgotten
        EOF
        
        # Create packages
        zip -r VaultKey-Complete.zip VaultKey/
        cd VaultKey/Windows && zip -r ../../VaultKey-Windows.zip . && cd ../..
        cd VaultKey/Mac && zip -r ../../VaultKey-Mac.zip . && cd ../..

        # Checksums, so downloads can be verified (see README)
        sha256sum VaultKey-Windows.zip VaultKey-Mac.zip > SHA256SUMS.txt
        cat SHA256SUMS.txt
    
    - name: Upload packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: VaultKey-All-Packages
        path: |
          VaultKey-Complete.zip
          VaultKey-Windows.zip
          VaultKey-Mac.zip
          SHA256SUMS.txt
        retention-days: 90

    # Signed provenance linking each zip to this repository and workflow run:
    # gh attestation verify VaultKey-Mac.zip --repo dhruvkulkarni02/vaultkey
    - name: Attest build provenance
      if: github.event_name == 'release'
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
      with:
        subject-path: |
          VaultKey-Windows.zip
          VaultKey-Mac.zip
    
    - name: Attach packages to the release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        gh release upload
        '${{ github.event.release.tag_name }}'
        VaultKey-Windows.zip VaultKey-Mac.zip SHA256SUMS.txt
        --clobber
        --repo '${{ github.repository }}'
